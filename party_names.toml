# Links parties across elections. Read by parties.py.
#
# One table per party, keyed by a stable party_id that's kept through renames.
# short_name is for display (tables, charts); for a renamed party it's the
# most recent name. Under it, each election year gives the name (or a list of
# names) the party appears under in that election's data, exactly as spelt
# there. List several names when different sources spell it differently.
#
# part_of = { YEAR = "party_id" } means the party's votes counted under an
# umbrella party in that election, so it has no votes of its own then.
#
# Every party name in the data must appear here; parties.py raises an error
# otherwise, so a new election means deciding explicitly how its parties link
# to earlier ones.

[act]
short_name = "ACT"
2017 = "ACT New Zealand"
2023 = "ACT New Zealand"
2026 = "ACT New Zealand"

[alcp]
short_name = "Legalise Cannabis"
2017 = "Aotearoa Legalise Cannabis Party"
2023 = "Aotearoa Legalise Cannabis Party"
2026 = "Aotearoa Legalise Cannabis Party"

[alliance]
short_name = "Alliance"
# Re-registered (p_no 68); the Alliance didn't stand in 2017 or 2023.
2026 = "Alliance Party"

[animal-justice]
short_name = "Animal Justice"
2023 = "Animal Justice Party"
2026 = "Animal Justice Party Aotearoa New Zealand"

[ban1080]
short_name = "Ban1080"
2017 = "Ban1080"

[conservative]
short_name = "Conservative"
# Renamed New Conservatives after 2017, then Conservative Party NZ.
2017 = "Conservative"
2023 = "New Conservatives"
2026 = "Conservative Party NZ"

[democracynz]
short_name = "DemocracyNZ"
2023 = "DemocracyNZ"

[free-palestine]
short_name = "Free Palestine"
2026 = "Free Palestine"

[freedoms-nz]
short_name = "Freedoms NZ"
# Umbrella party in 2023 for NZ Outdoors & Freedom, Rock the Vote NZ and
# Vision New Zealand.
2023 = "Freedoms NZ"

[green]
short_name = "Green"
2017 = "Green Party"
