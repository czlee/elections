# Builds the projection site (sites/2026-projection/), the overseas/domestic-split projection
# site (sites/2026-projection-complicated/) and the no-Māori-electorates site
# (sites/maori-to-general/) and the margins site (sites/margins/) and deploys them to GitHub Pages. The user site's custom domain
# (czlee.nz) covers this repo's project page, so this serves
# https://czlee.nz/elections/2026-projection/,
# https://czlee.nz/elections/2026-projection-complicated/ and
# https://czlee.nz/elections/maori-to-general/ and https://czlee.nz/elections/margins/.
# The landing page at https://czlee.nz/elections/ is sites/index.html, with its own copy of the font in
# sites/fonts/; the assemble step copies both into the Pages tree.
#
# The sites' data (sites/*/src/lib/data/) is committed: CI doesn't rerun the
# Python pipeline, which needs Stats NZ data and a slow Wayback scrape.
name: Deploy site

on:
  push:
    branches: [main]
    paths: [sites/**, .github/workflows/pages.yml, .nvmrc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            sites/2026-projection/package-lock.json
            sites/2026-projection-complicated/package-lock.json
            sites/maori-to-general/package-lock.json
            sites/margins/package-lock.json
      # Fails if the horseshoe chart's lane table is out of date with its constants; fix with --write.
      - name: Check the horseshoe lane table
        run: python3 scripts/horseshoe_lanes.py sites/*/src/lib/components/Parliament.svelte
      - run: npm ci
        working-directory: sites/2026-projection
      - run: npm run build
        working-directory: sites/2026-projection
        env:
          BASE_PATH: /elections/2026-projection
      - run: npm ci
        working-directory: sites/2026-projection-complicated
      - run: npm run build
        working-directory: sites/2026-projection-complicated
        env:
          BASE_PATH: /elections/2026-projection-complicated
      - run: npm ci
        working-directory: sites/maori-to-general
      - run: npm run build
        working-directory: sites/maori-to-general
        env:
          BASE_PATH: /elections/maori-to-general
      - run: npm ci
        working-directory: sites/margins
      - run: npm run build
        working-directory: sites/margins
        env:
          BASE_PATH: /elections/margins
      - name: Assemble Pages tree
        run: |
          mkdir -p _site
          cp -r sites/2026-projection/build _site/2026-projection
          cp -r sites/2026-projection-complicated/build _site/2026-projection-complicated
          cp -r sites/maori-to-general/build _site/maori-to-general
          cp -r sites/margins/build _site/margins
          cp sites/index.html _site/index.html
          cp -r sites/fonts _site/fonts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
