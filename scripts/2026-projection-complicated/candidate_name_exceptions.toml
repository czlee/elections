# Candidates whose name in the per-voting-place CSVs (download_specials.py) has
# a different surname from the official feed's, by election: "CSV name" =
# "official name". The CSVs use legal names and the feed uses the names
# candidates stood under. Candidates are matched by total votes (unique in
# every electorate); each pair here was checked by eye to be the same person:
# the given names agree, or the CSV gives the other surname, usually
# double-barrelled or hyphenated. download_specials.py stops on any surname
# mismatch not listed here, and on any entry here it didn't need. Comments
# give the electorate number.

